name: CMF Python CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install -r server/requirements.txt
          python -m pip install flake8

      - name: Lint with flake8
        run: python -m flake8 cmflib server --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit and server tests
        run: >-
          python -m pytest
          cmflib/tests
          test/server
          test/test_api_versioning.py
