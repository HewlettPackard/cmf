name: CMF Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cmf_test
          POSTGRES_PASSWORD: cmf_test_password
          POSTGRES_DB: mlmd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmf_test -d mlmd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: cmf_test
      POSTGRES_PASSWORD: cmf_test_password
      POSTGRES_DB: mlmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install project dependencies
        run: make setup

      - name: Run Python lint checks
        run: make lint

      - name: Run Python and MAT configuration tests
        run: make test

      - name: Build UI
        run: make test-ui