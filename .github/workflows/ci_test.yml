name: CMF Python CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmf-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e ".[test]" flake8 pytest-mock

      - name: Python lint checks
        run: python -m flake8 cmflib server mcp --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: CMF and DVC configuration tests
        run: >-
          python -m pytest -q
          cmflib/tests/utils/test_cmf_config.py
          cmflib/tests/utils/test_dvc_config.py

      - name: Local artifact storage tests
        run: python -m pytest -q cmflib/tests/storage_backends/test_local_artifacts.py

  ui-build:
    name: UI production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build UI
        run: npm run build --prefix ui