{{/* PostgreSQL credentials as a Secret (reference; envs are set directly for parity with compose) */}}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cmf.serviceName" (dict "ctx" . "component" "postgres") }}-auth
  labels:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
{{- end }}
