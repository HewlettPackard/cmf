{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cmf.serviceName" (dict "ctx" . "component" "ui") }}
  labels:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "cmf.componentLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cmf.componentLabels" (dict "ctx" . "component" "ui") | nindent 8 }}
    spec:
      {{- include "cmf.imagePullSecrets" . | nindent 6 }}
      # Wait for cmf-server to be reachable (compose: depends_on service_healthy)
      initContainers:
      - name: wait-for-server
        image: curlimages/curl:latest
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["sh", "-c"]
        args:
          - until curl -fsS http://{{ include "cmf.serviceName" (dict "ctx" . "component" "server") }}:{{ .Values.server.service.port }} >/dev/null; do echo waiting for cmf-server; sleep 3; done
      containers:
      - name: ui
        image: {{ include "cmf.image" (dict "ctx" . "image" .Values.ui.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.ui.port }}
        env:
        - name: REACT_APP_CMF_API_URL
          value: {{ .Values.ui.apiURL | quote }}
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.ui.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.ui.port }}
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cmf.serviceName" (dict "ctx" . "component" "ui") }}
  labels:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
  - name: http
    port: {{ .Values.ui.service.port }}
    targetPort: {{ .Values.ui.port }}
  selector:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
{{- end -}}
