{{- if .Values.tensorboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cmf.serviceName" (dict "ctx" . "component" "tensorboard") }}
  labels:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "tensorboard") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cmf.componentLabels" (dict "ctx" . "component" "tensorboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cmf.componentLabels" (dict "ctx" . "component" "tensorboard") | nindent 8 }}
    spec:
      {{- include "cmf.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: tensorboard
        image: {{ include "cmf.image" (dict "ctx" . "image" .Values.tensorboard.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        # The federcmf/tensorboard image already runs TensorBoard with
        # --path_prefix=/tensor_board; keep args aligned with tensorboard.Dockerfile.
        command: ["/bin/bash", "-c"]
        args:
          - tensorboard --logdir /logs --host 0.0.0.0 --path_prefix=/tensor_board --port {{ .Values.tensorboard.port }}
        ports:
        - containerPort: {{ .Values.tensorboard.port }}
        resources:
          {{- toYaml .Values.tensorboard.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /tensor_board
            port: {{ .Values.tensorboard.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /tensor_board
            port: {{ .Values.tensorboard.port }}
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: tensorboard-logs
          mountPath: /logs
      volumes:
      - name: tensorboard-logs
        {{- include "cmf.volumeSource" (dict "ctx" . "name" "tensorboard-logs" "subpath" "tensorboard-logs") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cmf.serviceName" (dict "ctx" . "component" "tensorboard") }}
  labels:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "tensorboard") | nindent 4 }}
spec:
  type: {{ .Values.tensorboard.service.type }}
  ports:
  - name: http
    port: {{ .Values.tensorboard.service.port }}
    targetPort: {{ .Values.tensorboard.port }}
  selector:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "tensorboard") | nindent 4 }}
{{- end -}}
