{{- if .Values.postgres.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cmf.serviceName" (dict "ctx" . "component" "postgres") }}
  labels:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cmf.componentLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cmf.componentLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      {{- include "cmf.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: postgres
        image: {{ include "cmf.image" (dict "ctx" . "image" .Values.postgres.image) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgres.auth.user | quote }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgres.auth.password | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.postgres.auth.database | quote }}
        resources:
          {{- toYaml .Values.postgres.resources | nindent 10 }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -p
            - "5432"
            - -d
            - {{ .Values.postgres.auth.database | quote }}
            - -U
            - {{ .Values.postgres.auth.user | quote }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -p
            - "5432"
            - -d
            - {{ .Values.postgres.auth.database | quote }}
            - -U
            - {{ .Values.postgres.auth.user | quote }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: postgres-data
        {{- include "cmf.volumeSource" (dict "ctx" . "name" "postgres-data" "subpath" "postgres_data") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cmf.serviceName" (dict "ctx" . "component" "postgres") }}
  labels:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.postgres.service.port }}
    targetPort: 5432
  selector:
    {{- include "cmf.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
{{- end -}}
